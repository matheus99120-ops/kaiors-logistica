<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos — Rastreio de Fretes 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181b22;
    --border: #252830;
    --accent: #00e5a0;
    --accent2: #0090ff;
    --text: #e8eaf0;
    --muted: #6b7080;
    --danger: #ff4d6a;
    --warn: #ffb547;
    --info: #0090ff;
    --entregue: #00e5a0;
    --coletado: #0090ff;
    --entregar: #ffb547;
    --agcoleta: #a855f7;
    --cancelado: #ff4d6a;
    --envsedex: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- HEADER ---- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(1.4); } }
  .header-right { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--muted); }
  .live-badge { display:flex; align-items:center; gap:6px; background: rgba(0,229,160,0.08); border:1px solid rgba(0,229,160,0.2); border-radius:20px; padding:4px 12px; font-size:12px; color:var(--accent); }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.5s infinite; }

  /* ---- MAIN ---- */
  main { padding: 32px; max-width: 1600px; margin: 0 auto; }

  /* ---- KPI CARDS ---- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .kpi-card.all::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .kpi-card.entregue::before { background: var(--entregue); }
  .kpi-card.coletado::before { background: var(--coletado); }
  .kpi-card.entregar::before { background: var(--entregar); }
  .kpi-card.agcoleta::before { background: var(--agcoleta); }
  .kpi-card.envsedex::before { background: var(--envsedex); }
  .kpi-card.cancelado::before { background: var(--cancelado); }
  .kpi-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .kpi-card.active { border-color: var(--accent); background: var(--surface2); }
  .kpi-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .kpi-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; line-height: 1; }
  .kpi-card.all .kpi-value { color: var(--accent); }
  .kpi-card.entregue .kpi-value { color: var(--entregue); }
  .kpi-card.coletado .kpi-value { color: var(--coletado); }
  .kpi-card.entregar .kpi-value { color: var(--entregar); }
  .kpi-card.agcoleta .kpi-value { color: var(--agcoleta); }
  .kpi-card.envsedex .kpi-value { color: var(--envsedex); }
  .kpi-card.cancelado .kpi-value { color: var(--cancelado); }
  .kpi-pct { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ---- TOOLBAR ---- */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  .search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px 11px 42px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }
  select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent); }
  .results-count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* ---- TABLE ---- */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  th {
    padding: 13px 16px;
    text-align: left;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  td {
    padding: 13px 16px;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }
  td.pedido {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    color: var(--accent2);
    font-size: 12px;
  }
  td.cliente { font-weight: 500; color: var(--text); }

  /* STATUS BADGE */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; }
  .badge.ENTREGUE { background: rgba(0,229,160,0.12); color: var(--entregue); }
  .badge.ENTREGUE .badge-dot { background: var(--entregue); }
  .badge.COLETADO { background: rgba(0,144,255,0.12); color: var(--coletado); }
  .badge.COLETADO .badge-dot { background: var(--coletado); }
  .badge.ENTREGAR { background: rgba(255,181,71,0.12); color: var(--entregar); }
  .badge.ENTREGAR .badge-dot { background: var(--entregar); }
  .badge.AG\.COLETA { background: rgba(168,85,247,0.12); color: var(--agcoleta); }
  .badge.AG\.COLETA .badge-dot { background: var(--agcoleta); }
  .badge.ENV\.SEDEX { background: rgba(34,211,238,0.12); color: var(--envsedex); }
  .badge.ENV\.SEDEX .badge-dot { background: var(--envsedex); }
  .badge.CANCELADO { background: rgba(255,77,106,0.12); color: var(--cancelado); }
  .badge.CANCELADO .badge-dot { background: var(--cancelado); }

  /* ---- MODAL ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
  .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); flex-shrink: 0;
    transition: all 0.2s;
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }
  .modal-body { padding: 24px 28px; }
  .modal-section { margin-bottom: 24px; }
  .modal-section-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-field label { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-field span { font-size: 14px; color: var(--text); font-weight: 500; word-break: break-word; }
  .modal-field span.empty { color: var(--muted); font-style: italic; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    border-top: 1px solid var(--border);
  }
  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 13px; color: var(--muted); }

  /* UPDATE BANNER */
  .update-banner {
    display: none;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.3);
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--accent);
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .update-banner.show { display: flex; }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state svg { opacity: 0.3; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  @media (max-width: 768px) {
    main { padding: 16px; }
    header { padding: 0 16px; }
    .modal-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    td { max-width: 120px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    Kairos Logística
  </div>
  <div class="header-right">
    <div class="live-badge">
      <div class="live-dot"></div>
      Dados em tempo real
    </div>
    <span id="last-update">—</span>
  </div>
</header>

<main>
  <div class="update-banner" id="update-banner" onclick="reloadData()">
    🔄 Novos dados disponíveis — Clique para atualizar
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar por pedido, cliente, transportadora, NF, estado..." />
    </div>
    <select id="filter-transportadora">
      <option value="">Todas as transportadoras</option>
    </select>
    <select id="filter-estado">
      <option value="">Todos os estados</option>
    </select>
    <span class="results-count" id="results-count"></span>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('PEDIDO')" id="th-PEDIDO">Pedido</th>
          <th onclick="sortBy('CLIENTE / FORN')" id="th-CLIENTE">Cliente / Fornecedor</th>
          <th onclick="sortBy('STATUS')" id="th-STATUS">Status</th>
          <th onclick="sortBy('DATA DA COLETA')" id="th-DATA">Coleta</th>
          <th onclick="sortBy('PREV. ENTREGA')" id="th-PREV">Prev. Entrega</th>
          <th onclick="sortBy('ENTREGUE')" id="th-ENTREGUE">Entregue em</th>
          <th onclick="sortBy('TRANSPORTADORA')" id="th-TRANSP">Transportadora</th>
          <th>Estado</th>
          <th>NF Saída</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/></svg>
      <p>Nenhum resultado encontrado para sua busca.</p>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <div class="modal-close" onclick="closeModalDirect()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

const SHEET_ID = "1X20ZMq1qgp7tQp1-LzMcmsp-doEc6E5-TUrnC_eiJMQ";
const GID = "896679410";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const PAGE_SIZE = 50;

// ===== STATE =====
let allData = [];
let filtered = [];
let currentPage = 1;
let sortCol = 'DATA DA COLETA';
let sortDir = -1;

// ===== INIT =====
function init() {
  allData = EMBEDDED_DATA.filter(r => r.PEDIDO && r.PEDIDO.trim());
  buildFilters();
  render();
  setLastUpdate();
  // Try live refresh from sheet after 2s
  setTimeout(tryFetchLive, 2000);
  // Auto-refresh every 5 min
  setInterval(tryFetchLive, 5 * 60 * 1000);
}

function setLastUpdate() {
  const now = new Date();
  document.getElementById('last-update').textContent =
    'Atualizado: ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

// ===== LIVE FETCH =====
async function tryFetchLive() {
  try {
    const resp = await fetch(CSV_URL + '&cachebust=' + Date.now(), {cache:'no-cache'});
    if (!resp.ok) return;
    const text = await resp.text();
    const parsed = parseCSV(text);
    if (parsed.length > 0 && parsed.length !== allData.length) {
      document.getElementById('update-banner').classList.add('show');
      window._newData = parsed;
    } else if (parsed.length > 0) {
      allData = parsed.filter(r => r.PEDIDO && r.PEDIDO.trim());
      buildFilters();
      render();
      setLastUpdate();
    }
  } catch(e) { /* silently fail - use embedded data */ }
}

function reloadData() {
  if (window._newData) {
    allData = window._newData.filter(r => r.PEDIDO && r.PEDIDO.trim());
    buildFilters();
    render();
    setLastUpdate();
    document.getElementById('update-banner').classList.remove('show');
    window._newData = null;
  }
}

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h.trim()] = (vals[idx] || '').trim(); });
    result.push(obj);
  }
  return result;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

// ===== FILTERS =====
function buildFilters() {
  const transp = [...new Set(allData.map(r => r.TRANSPORTADORA).filter(Boolean))].sort();
  const estados = [...new Set(allData.map(r => r.ESTADO).filter(Boolean))].sort();

  const tSel = document.getElementById('filter-transportadora');
  const prevT = tSel.value;
  tSel.innerHTML = '<option value="">Todas as transportadoras</option>';
  transp.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; tSel.appendChild(o); });
  tSel.value = prevT;

  const eSel = document.getElementById('filter-estado');
  const prevE = eSel.value;
  eSel.innerHTML = '<option value="">Todos os estados</option>';
  estados.forEach(e => { const o = document.createElement('option'); o.value=e; o.textContent=e; eSel.appendChild(o); });
  eSel.value = prevE;
}

// ===== KPI ====
function renderKPIs() {
  const total = allData.length;
  const counts = {};
  allData.forEach(r => { counts[r.STATUS] = (counts[r.STATUS]||0)+1; });
  
  const configs = [
    {key:'', label:'Total', cls:'all', val: total},
    {key:'ENTREGUE', label:'Entregue', cls:'entregue', val: counts['ENTREGUE']||0},
    {key:'COLETADO', label:'Coletado', cls:'coletado', val: counts['COLETADO']||0},
    {key:'ENTREGAR', label:'A Entregar', cls:'entregar', val: counts['ENTREGAR']||0},
    {key:'AG.COLETA', label:'Ag. Coleta', cls:'agcoleta', val: counts['AG.COLETA']||0},
    {key:'ENV.SEDEX', label:'Env. Sedex', cls:'envsedex', val: counts['ENV.SEDEX']||0},
    {key:'CANCELADO', label:'Cancelado', cls:'cancelado', val: counts['CANCELADO']||0},
  ];

  const grid = document.getElementById('kpi-grid');
  grid.innerHTML = configs.map(c => `
    <div class="kpi-card ${c.cls} ${activeStatus===c.key?'active':''}" onclick="setStatus('${c.key}')">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.val}</div>
      ${c.key && total ? `<div class="kpi-pct">${Math.round(c.val/total*100)}% do total</div>` : ''}
    </div>
  `).join('');
}

// ===== SORT =====
function sortBy(col) {
  if (sortCol === col) { sortDir *= -1; } else { sortCol = col; sortDir = -1; }
  render();
}

// ===== RENDER =====
function render() {
  renderKPIs();
  
  const search = searchTerm.toLowerCase();
  filtered = allData.filter(r => {
    if (activeStatus && r.STATUS !== activeStatus) return false;
    if (filterTransp && r.TRANSPORTADORA !== filterTransp) return false;
    if (filterEstado && r.ESTADO !== filterEstado) return false;
    if (search) {
      const haystack = [r.PEDIDO, r['CLIENTE / FORN'], r.TRANSPORTADORA, r['Nº NF SAIDA'], r.ESTADO, r.STATUS, r['N° PEDIDO CLIENTE'], r['PROT. COLETA/RASTREIO']].join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    let av = a[sortCol]||'', bv = b[sortCol]||'';
    // Date sort
    if (av.match(/\d{2}\/\d{2}\/\d{4}/)) {
      const da = parseDate(av), db = parseDate(bv);
      return (da - db) * sortDir;
    }
    return av.localeCompare(bv, 'pt-BR') * sortDir;
  });

  const total = filtered.length;
  document.getElementById('results-count').textContent = total + ' registro' + (total!==1?'s':'') + ' encontrado' + (total!==1?'s':'');

  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = 1;
  const start = (currentPage-1)*PAGE_SIZE;
  const page = filtered.slice(start, start+PAGE_SIZE);

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = page.map((r,i) => `
    <tr onclick="openModal(${start+i})">
      <td class="pedido">${r.PEDIDO||'—'}</td>
      <td class="cliente" title="${r['CLIENTE / FORN']||''}">${r['CLIENTE / FORN']||'—'}</td>
      <td><span class="badge ${(r.STATUS||'').replace('.','\\.')}">${statusBadge(r.STATUS)}</span></td>
      <td>${r['DATA DA COLETA']||'—'}</td>
      <td>${r['PREV. ENTREGA']||'—'}</td>
      <td>${r.ENTREGUE||'—'}</td>
      <td title="${r.TRANSPORTADORA||''}">${r.TRANSPORTADORA||'—'}</td>
      <td title="${r.ESTADO||''}">${r.ESTADO||'—'}</td>
      <td>${r['Nº NF SAIDA']||'—'}</td>
    </tr>
  `).join('');

  document.getElementById('empty-state').style.display = page.length ? 'none' : 'block';
  renderPagination(totalPages);
}

function statusBadge(s) {
  return '<span class="badge-dot"></span>' + (s||'—');
}

function parseDate(str) {
  if (!str || !str.match(/\d{2}\/\d{2}\/\d{4}/)) return 0;
  const [d,m,y] = str.split('/');
  return new Date(y,m-1,d).getTime();
}

// ===== PAGINATION =====
function renderPagination(total) {
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML=''; return; }
  
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Anterior</button>`;
  
  let pages = [];
  for (let i=1;i<=total;i++) {
    if (i===1||i===total||Math.abs(i-currentPage)<=2) pages.push(i);
    else if (pages[pages.length-1]!=='...') pages.push('...');
  }
  
  pages.forEach(p => {
    if (p==='...') html += `<span class="page-info">…</span>`;
    else html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>Próxima ›</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== FILTERS EVENTS =====
function setStatus(s) {
  activeStatus = s;
  currentPage = 1;
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  currentPage = 1;
  render();
});
document.getElementById('filter-transportadora').addEventListener('change', e => {
  filterTransp = e.target.value;
  currentPage = 1;
  render();
});
document.getElementById('filter-estado').addEventListener('change', e => {
  filterEstado = e.target.value;
  currentPage = 1;
  render();
});

  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModalDirect(); });

// ===== GO =====
init();
</script>
</body>
</html>
